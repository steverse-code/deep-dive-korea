name: Daily content watchdog

# GitHub 스케줄 실행이 드롭되었을 때 콘텐츠 생성만 1회 보완한다.
# Instagram 발행은 절대 재실행하지 않는다. 실패/적체는 사람이 확인한다.
on:
  schedule:
    - cron: "50 0 * * *"   # 00:50 UTC = 09:50 KST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - name: 오늘 생성 실행 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE="$(date -u +%Y-%m-%dT00:00:00Z)"
          COUNT=$(gh run list --repo "${{ github.repository }}" \
            --workflow=daily-content.yml \
            --json createdAt \
            --jq "[.[] | select(.createdAt >= \"$SINCE\")] | length")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$SINCE 이후 콘텐츠 생성 실행: ${COUNT}건"

      - name: 생성 실행이 없으면 1회 보완
        if: steps.check.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily-content.yml --repo "${{ github.repository }}" \
            -f dry_run=false

  report-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 대기 항목은 보고만 하고 재발행하지 않음
        run: |
          python3 - <<'PY'
          import json
          pending = [e["slug"] for e in json.load(open("queue.json"))
                     if e.get("status") == "pending"
                     or e.get("reel_status") == "pending"]
          if pending:
              print("확인이 필요한 pending:", ", ".join(pending))
              print("워치독은 Instagram 발행 워크플로를 재실행하지 않습니다.")
          else:
              print("pending 없음")
          PY
