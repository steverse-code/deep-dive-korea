name: Publish to Instagram

# 매일 19:00 KST에 최신 due 항목 1건만 발행한다.
# 밀린 항목은 따라잡아 발행하지 않고 held로 전환한다.
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 19:00 KST
  workflow_dispatch:
    inputs:
      slug:
        description: "특정 글 강제 발행 (비우면 큐에서 자동 선택)"
        required: false
      dry_run:
        description: "실제 발행 없이 점검만"
        type: boolean
        default: false
      reel:
        description: "캐러셀 대신 릴스(mp4)로 발행 (slug 필수)"
        type: boolean
        default: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

# 러너는 UTC 로 동작한다. 봇 커밋의 author/committer 시각이 UTC 로 찍히면
# 사용자가 KST 로 남긴 커밋과 섞여 git log 순서가 뒤죽박죽으로 보인다.
env:
  TZ: Asia/Seoul

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          ARGS=""
          [ -n "${{ inputs.slug }}" ] && ARGS="$ARGS --slug ${{ inputs.slug }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.reel }}" = "true" ] && ARGS="$ARGS --reel"
          python3 scripts/publish.py $ARGS

      # 발행 결과를 큐에 반드시 반영한다.
      # 이 push 가 실패하면 remote 큐에 pending 이 남아, 다음 크론이 같은 글을
      # 또 발행한다(2026-08-22 bib-gourmand 중복 발행이 이 경로였다).
      # 그래서 rebase 후 재시도하고, 그래도 안 되면 잡을 실패시켜 눈에 띄게 한다.
      #
      # always() 인 이유: 여러 건을 도는 중 뒤쪽 1건이 실패하면 발행 스텝이 죽는데,
      # 그때 이 스텝을 건너뛰면 앞서 실제로 나간 글들이 remote 에 pending 으로 남아
      # 다음 크론이 통째로 재발행한다. 실패했을 때야말로 큐를 커밋해야 한다.
      - name: Update queue
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet && exit 0
          git commit -m "publish: mark posted"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "큐 반영 완료 (시도 $i)"
              exit 0
            fi
            echo "push 거부됨 — rebase 후 재시도 ($i/5)"
            git pull --rebase --autostash || exit 1
            sleep $((i * 3))
          done
          echo "::error::큐 반영 실패 — remote 에 pending 이 남아 중복 발행 위험이 있습니다"
          exit 1
